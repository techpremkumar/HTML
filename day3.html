<!--
<q> Tag	Used to display short quotations with quotation marks automatically.
<sub> Tag	Used to display subscript text slightly below the normal line.
<abbr> Tag	Used to define abbreviations or short forms with full meaning.
target Attribute	Used to decide where the linked page should open.
mailto	Used to open the default email application through a link.
Favicon	Small icon displayed in the browser tab of a website.
<table> Tag	Used to create tables with rows and columns.
<caption> Tag	Used to give a title or heading for a table.
colspan	Used to merge multiple columns into one cell.
rowspan	Used to merge multiple rows into one cell.
-->
<!DOCTYPE html>
<html>
<head>
    <title>HTML Topics Practice</title>

    <!-- Favicon -->
    <link rel="icon" href="Flower2.jpg">

</head>
<body>

    <!-- q Tag -->
    <h2>q Tag</h2>
    <p>
        Teacher said,
        <q>Practice HTML daily</q>
    </p>

    <hr>

    <!-- sub Tag -->
    <h2>sub Tag</h2>
    <p>Water Formula : H<sub>2</sub>o</p>
    <p>Carbon Dioxide : CO<sub>2</sub></p>

    <hr>

    <!-- abbr Tag -->
    <h2>abbr Tag</h2>
    <p>
        <abbr title="Hyper Text Markup Language">
            HTML
        </abbr>
    </p>

    <p>
        <abbr title="Cascading Style Sheets">
            CSS
        </abbr>
    </p>

    <hr>

    <!-- target attribute -->
    <h2>target Attribute</h2>

    <a href="https://www.google.com"
       target="_blank">
       Open Google
    </a>

    <br><br>

    <a href="https://www.youtube.com"
       target="_self">
       Open YouTube
    </a>

    <hr>

    <!-- mailto -->
    <h2>mailto</h2>

    <a href="mailto:test@gmail.com?subject=HTML Learning&body=I am practicing HTML">
        Send Mail
    </a>

    <hr>

    <!-- Table -->
    <h2>Table Example</h2>

    <table border="1">

        <!-- caption -->
        <caption>Student Details</caption>

        <!-- colspan -->
        <tr>
            <th colspan="3">
                Student Information
            </th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <!-- rowspan -->
        <tr>
            <td rowspan="2">Prem</td>
            <td>21</td>
            <td>Chennai</td>
        </tr>

        <tr>
            <td>22</td>
            <td>Mayiladuthurai</td>
        </tr>

    </table>

</body>
</html>
