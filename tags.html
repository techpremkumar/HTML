<!--
4. Paragraph Tag

Description:
<p> tag is used to write paragraphs in HTML.
-->

<p>
    This is a paragraph tag in HTML.
</p>



<!--
5. Pre Tag

Description:
<pre> tag displays text exactly as written,
including spaces and line breaks.
-->

<pre>
Hello
    Welcome to HTML
</pre>



<!--
6. Anchor Tag

Description:
<a> tag is used to create hyperlinks.
-->

<!-- Syntax -->
<a href="URL">Link Name</a>

<!-- Example -->
<a href="https://www.google.com">
    Visit Google
</a>



<!--
7. Image Tag

Description:
<img> tag is used to display images.

Important Attributes:
src   -> Image path
alt   -> Alternative text
width -> Image width
-->

<img src="Flower2.jpg"
     alt="Flower Image"
     width="100">



<!--
8. BR and HR Tags

Description:
<br> -> Line break
<hr> -> Horizontal line
-->

Hello <br>
World

<hr>
