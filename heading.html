<!---
Heading Tags
Description

Heading tags are used for titles and headings.
HTML provides 6 heading tags from <h1> to <h6>.

<h1> → Biggest heading
<h6> → Smallest heading
-->
    <!-- Defines HTML5 Document -->
<!DOCTYPE html>

<!-- Root Element -->
<html>

<!-- Head Section Starts -->
<head>

    <!-- Page Title -->
    <title>Document</title>

</head>

<!-- Body Section Starts -->
<body>

    <!-- Main Heading -->
    <h1>Main Heading</h1>

    <!-- Sub Heading -->
    <h2>Sub Heading</h2>

    <!-- Small Heading -->
    <h3>Small Heading</h3>

    <!-- Content Displayed in Browser -->
    Hello World

</body>

</html>
