<!--
Text Formatting Tags in HTML
1. <small> Tag

Used to display smaller text.

<p>This is normal text.</p>
<small>This is small text.</small>

Output:

Normal text
Smaller text
2. <em> Tag

Used to emphasize text (usually italic).

<p>I am learning <em>HTML</em>.</p>

Output:

HTML appears emphasized/italic.
3. <b> Tag

Used to make text bold.

<p>This is <b>bold</b> text.</p>

Output:

bold text

4. <i> Tag

Used to display italic text.

<p>This is <i>italic</i> text.</p>

Output:

italic text
5. <mark> Tag

Used to highlight text.

<p>This is <mark>highlighted</mark> text.</p>

Output:

highlighted text with background color
-->
<!DOCTYPE html>
<html>
<head>
    <title>Formatting Tags</title>
</head>
<body>

    <p>This is <small>small</small> text.</p>

    <p>This is <em>emphasized</em> text.</p>

    <p>This is <b>bold</b> text.</p>

    <p>This is <i>italic</i> text.</p>

    <p>This is <mark>highlighted</mark> text.</p>
    <marquee behavior="alternate" direction="right">hi this is Shine</marquee>
    <marquee behavior="right" direction="left">hi this is Goat </marquee>

</body>
</html>
