<h2>Table Example</h2>

    <table border="1">

        <!-- caption -->
        <caption>Student Details</caption>

        <!-- colspan -->
        <tr>
            <th colspan="3">
                Student Information
            </th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <!-- rowspan -->
        <tr>
            <td rowspan="2">Prem</td>
            <td>21</td>
            <td>Chennai</td>
        </tr>

        <tr>
            <td>22</td>
            <td>Mayiladuthurai</td>
        </tr>

    </table>
