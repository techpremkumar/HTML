<!--
Tag	Purpose
<ul>	Displays bullet list
<ol>	Displays numbered list0
-->
<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

<h2>Unordered List</h2>

<ul>
    <li>Apple</li>
    <li>Mango</li>
    <li>Orange</li>
</ul>

<h2>Ordered List</h2>

<ol>
    <li>Wake Up</li>
    <li>Study HTML</li>
    <li>Practice Coding</li>
</ol>

</body>
</html>
